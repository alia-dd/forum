{{define "content"}}
{{$user := .PageContent}}
{{if .IsOwner}}{{$user = .User}}{{end}}

<div id="profile" class="profile">
    <aside class="profile-info">
        <img {{if $user.Image}} src="/static/assets/images/{{$user.Image}}" {{else}} src="/static/assets/images/avatar1.jpg" {{end}} alt="Avatar" class="avatar">
        <h1 class="profile-name">[{{$user.Name}}]</h1>
        <p class="profile-username">@[{{$user.Username}}]</p>
        

        {{if $user.Bio}}<p class="profile-bio">{{$user.Bio}}</p>{{end}}

        {{if .IsOwner}}
            <p class="profile-email">{{$user.Email}}</p>
            <div class="profile-action">
                <a class="btn" href="/user/profile/edit">Edit Profile</a>
                <a class="btn btn-chg" href="/user/profile/password">Change password</a>
            </div>
        {{end}}
    </aside>

    <section class="profile-content" style="display: flex; flex-direction: column;">
        {{template "profile_nav" .}}
        <section style="display: block;">
            content
        </section>
       
    </section>

</div>

{{end}}
