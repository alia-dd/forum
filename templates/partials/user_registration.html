{{define "content"}}
<div id="registerdiv">
<form>
     <div class="title">Registration Form</div>
      <div class="inputContainer">
        <label>Full Name</label>
        <div><input type="text" placeholder="Enter your name" required/></div>
      </div>
      <div class="inputContainer">
        <label>UserName</label>
        <div><input type="text" placeholder="Enter your username" required/></div>
      </div>
      <div class="inputContainer">
        <label>Email</label>
        <div><input type="email" placeholder="Enter your email" required/></div>
      </div>
      <div class="inputContainer">
        <label>Password</label>
        <div><input type="text" placeholder="Enter your password" required/></div>
      </div>
      <div class="inputContainer">
        <label>Confirm Password</label>
        <div><input type="text" placeholder="Confirm your password" required/></div>
      </div>
      <button class="btnSubmit">Submit</button>
</form>
</div>
{{end}}
