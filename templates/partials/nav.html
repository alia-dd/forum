{{define "nav"}}
<nav class="nav">
  <a href="/" class="nav__logo">
    <span class="nav__logo-icon">⬡</span>
    BOOKFORUM
  </a>

  <form method="GET" action="/search">
    <select name="scope">
      <option value="all" {{if eq .Scope "all"}}selected{{end}}>All</option>
      <option value="users" {{if eq .Scope "users"}}selected{{end}}></option>>Users</option>
      <option value="posts" {{if eq .Scope "posts"}}selected{{end}}></option>>Posts</option>
      <option value="comments" {{if eq .Scope "comments"}}selected{{end}}></option>>Comments</option>
    </select>

    <input type="search" name="q" value="{{.Query}}" placeholder="Search...">
    <button type="submit">Search</button>
  </form>

  <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <ul class="nav__links" id="navLinks">
    <li><a href="/" class="nav__link" data-label="Home">Home</a></li>
    <li><a href="/" class="nav__link" data-label="Favorites">
      <span>Books</span>
      <span class="nav__fav-icon"><i class="ph ph-heart"></i></span>
    </a></li>
    <li class="nav__divider"></li>
    <!-- {{if .User}} -->
    <li><a href="/user/profile" class="nav__link" data-label="Profile">Profile</a></li>
    <li>
      <form method="POST" action="/user/logout" class="nav__logout-form" >
        <button type="submit" class="nav__link nav__link--cta">Sign out</button>
      </form>
    </li>
    <!-- {{else}} -->
    <li><a href="/user/login" class="nav__link">Sign in</a></li>
    <li><a href="/user/register" class="nav__link nav__link--cta">Sign up</a></li>
    <!-- {{end}} -->
  </ul>
</nav>
{{end}}
