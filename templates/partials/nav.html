{{define "nav"}}
<nav class="nav">
  <a href="/" class="nav__logo">
    <span class="nav__logo-icon"><i class="ph ph-cat"></i></span>
    <span class="nav__logo-title">Literary Lions</span>
  </a>

  <form method="GET" action="/search" class="nav__search">
    <select name="scope">
      <option value="all" {{if eq .Scope "all"}}selected{{end}}>All</option>
      <option value="users" {{if eq .Scope "users"}}selected{{end}}>Users</option>
      <option value="posts" {{if eq .Scope "posts"}}selected{{end}}>Posts</option>
      <option value="comments" {{if eq .Scope "comments"}}selected{{end}}>Comments</option>
    </select>

    <select name="sort">
      <option value="relevance" {{if eq .Sort "relevance"}}selected{{end}}>Relevance</option>
      <option value="time" {{if eq .Sort "time"}}selected{{end}}>Newest</option>
    </select>

      <div class="admin-search">
          <label >
            <i class="ph ph-magnifying-glass"></i>
            <input type="search" name="q" value="{{.Query}}" placeholder="Search..." minlength="3" required>
          </label>
          <button type="submit">Search</button>
      </div>
  </form>

  <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <ul class="nav__links" id="navLinks">
    <li><a href="/" class="nav__link" data-label="Home">Home</a></li>
    <li class="nav__divider"></li>
    {{if .User}}

     {{if eq .User.Role "admin"}}
        <li><a href="/admin/users" class="nav__link" data-label="Admin_Panel">Admin Panel</a></li>
      {{end}}

    <li >
      <a href="/user/profile" class="nav__link" data-label="Profile">
        <img {{if .User.Image}} src="/static/assets/images/{{.User.Image}}" {{else}} src="/static/assets/images/avatar1.jpg" {{end}} alt="Avatar" class=" admin-table-avatar">
        Profile</a>
    </li>
    <li class="nav__logout-form" >
      <form method="POST" action="/user/logout"  >
        <button type="submit" class="nav__link nav__link--cta">Sign out</button>
      </form>
    </li>
    {{else}}
    <li><a href="/user/login" class="nav__link">Sign in</a></li>
    <li class="singUPbtn"><a href="/user/register" class=" nav__link">Sign up</a></li>
    {{end}}
  </ul>
</nav>
<div id="navOverlay" class="navOverlay"></div>
<script>
  const toggle = document.getElementById('navToggle')
  const links  = document.getElementById('navLinks')
  const overlay = document.getElementById('navOverlay');

  toggle.addEventListener('click', () => {
    const open = links.classList.toggle('open');
    toggle.setAttribute('aria-expanded', open);
    console.log("overlay",overlay)
    overlay.classList.toggle('visible', open);

  });
  document.querySelectorAll('.nav__link').forEach(a => {
    if (a.getAttribute('href') === location.pathname) a.classList.add('active')
  })
</script>
{{end}}
